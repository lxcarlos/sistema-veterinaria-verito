<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verito · Sistema veterinario</title>
    <link rel="stylesheet" href="./css/estilos.css" />
  </head>
  <body>
    <header class="barra-superior">
      <a class="marca" href="#" aria-label="Veterinaria Verito, inicio">
        <span>VeterinariaVerito</span>
      </a>
      <div id="acciones-cabecera"></div>
    </header>
    <main id="app" class="contenedor-principal"></main>
    <footer class="pie-sitio">
      <div class="pie-sitio-cabecera">
        <div>
          <p class="pie-sitio-sobrelinea">Cuidado animal, con intención</p>
          <p class="pie-sitio-descripcion">
            Una forma más cercana de acompañar cada historia.
          </p>
        </div>
        <a class="pie-sitio-enlace" href="#app">Volver arriba <span>↑</span></a>
      </div>
      <div class="pie-sitio-marca" aria-hidden="true">VERITO</div>
      <div class="pie-sitio-base">
        <span>Atención veterinaria · Orientación · Citas</span>
        <span>Hecho para cuidar mejor.</span>
      </div>
    </footer>
    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
